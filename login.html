<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f8fa;
            height: 100vh;
        }

        .login-container {
            max-width: 450px;
            margin: auto;
            padding-top: 40px;
        }

        .twitter-logo {
            color: #1DA1F2;
            font-size: 40px;
        }

        .login-title {
            font-size: 48px;
            font-weight: 700;
            margin: 20px 0 30px;
        }

        .form-control {
            height: 55px;
            border-radius: 2px;
        }

        .btn-twitter {
            background-color: #1DA1F2;
            border: none;
            height: 50px;
            border-radius: 30px;
            font-weight: 600;
        }

        .btn-twitter:hover {
            background-color: #1991db;
        }

        .bottom-links a {
            color: #1DA1F2;
            text-decoration: none;
            font-size: 14px;
        }

        .bottom-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="login-container">

        <!-- Logo -->
        <div class="mb-3">
            <i class="bi bi-twitter twitter-logo"></i>
        </div>

        <!-- Heading -->
        <h1 class="login-title">Log in to Twitter</h1>

        <!-- Login Form -->
        <form>

            <div class="mb-3">
                <input type="text"
                       class="form-control"
                       placeholder="Phone number, email address">
            </div>

            <div class="mb-4">
                <input type="password"
                       class="form-control"
                       placeholder="Password">
            </div>

            <button type="submit"
                    class="btn btn-twitter text-white w-100 mb-4">
                Log In
            </button>

            <div class="d-flex justify-content-between bottom-links">
                <a href="#">Forgot password?</a>
                <a href="#">Sign up to Twitter</a>
            </div>

        </form>

    </div>
</div>

</body>
</html>
